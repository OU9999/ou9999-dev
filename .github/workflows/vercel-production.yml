name: Vercel Production

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  production-gate:
    name: production-gate
    runs-on: ubuntu-latest

    env:
      VERCEL_DEPLOY_ENABLED: ${{ vars.VERCEL_DEPLOY_ENABLED }}

    steps:
      - name: Validate production gate
        run: |
          if [ "$GITHUB_REF" != "refs/heads/release" ]; then
            echo "Production deploy requires refs/heads/release."
            exit 1
          fi

          if [ "$VERCEL_DEPLOY_ENABLED" != "true" ]; then
            echo "VERCEL_DEPLOY_ENABLED must be true."
            exit 1
          fi

  deploy:
    name: deploy
    needs: production-gate
    runs-on: ubuntu-latest
    environment: production

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
        run: pnpm exec vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: pnpm exec vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        run: pnpm exec vercel deploy --prebuilt --archive=tgz --prod --token="$VERCEL_TOKEN"
